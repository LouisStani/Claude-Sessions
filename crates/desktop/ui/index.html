<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>claude-sessions</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="bar">
    <nav id="tabs"></nav>
    <ol id="chips"></ol>
    <p id="status"></p>
  </header>
  <main id="panes"></main>
  <div id="tip" hidden></div>
  <dialog id="new-session">
    <form id="new-form">
      <h1>new session</h1>
      <label>account <select name="account"></select></label>
      <label>directory <input name="directory" spellcheck="false" autocomplete="off"></label>
      <ol class="suggestions" hidden></ol>
      <label>short name <input name="name" placeholder="e.g. router (else Claude Code picks one)" spellcheck="false" autocomplete="off"></label>
      <p id="new-message"></p>
      <button type="submit">start</button>
    </form>
  </dialog>
  <dialog id="new-project">
    <form id="project-form">
      <h1>new project</h1>
      <label>directory <input name="directory" spellcheck="false" autocomplete="off"></label>
      <ol class="suggestions" hidden></ol>
      <p id="project-message"></p>
      <button type="submit">add</button>
    </form>
  </dialog>
  <dialog id="rename">
    <form id="rename-form">
      <h1>short name</h1>
      <label>name <input name="label" placeholder="empty: Claude Code's name" spellcheck="false" autocomplete="off"></label>
      <p id="rename-message"></p>
      <button type="submit">save</button>
    </form>
  </dialog>
  <dialog id="picker">
    <input id="picker-query" placeholder="search sessions" spellcheck="false" autocomplete="off">
    <ol id="picker-results"></ol>
  </dialog>
</body>
</html>
