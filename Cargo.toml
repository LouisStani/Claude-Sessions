[package]
name = "claude-sessions"
version = "0.3.0"
edition = "2024"
description = "Several Claude Code sessions, across several accounts, side by side"
license = "CC-BY-NC-SA-4.0"
publish = false

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
claude-accounts = { git = "https://github.com/LouisStani/Claude-Accounts", tag = "v2.0.0" }
notify = "8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
