[workspace]
members = ["crates/core", "crates/desktop", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false

[workspace.dependencies]
claude-accounts = { git = "https://github.com/LouisStani/Claude-Accounts", tag = "v2.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
